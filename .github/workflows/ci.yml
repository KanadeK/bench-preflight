name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - name: Install wheel
        shell: python
        run: |
          import glob, subprocess, sys
          subprocess.run([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')], check=True)
      - run: python -m pip check
      - run: python -m pytest
      - name: Verify real Google Benchmark output
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libbenchmark-dev
          mkdir -p build
          g++ -std=c++17 examples/native_benchmark.cpp -lbenchmark -lpthread -o build/native-benchmark
          python examples/native_smoke.py build/native-benchmark
